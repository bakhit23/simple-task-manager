<!DOCTYPE html>
<html>
<head>
    <title>Simple Task Manager</title>
</head>

<body>
    <h1>Simple Task Manager</h1>

    <form method="POST">
        <input type="text" name="task" placeholder="Enter a new task">
        <button type="submit">Add Task</button>
    </form>

    <h2>My Tasks</h2>

    <ul>
        {% for task in tasks %}
            <li>{{ task }}</li>
        {% endfor %}
    </ul>

</body>
</html>
